<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Application — Citizen Services Portal (Demo)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/shared.css">
</head>
<body class="bg-[var(--gov-bg)] text-slate-800">

<a href="#main-content" class="skip-link focus-ring bg-white text-[var(--gov-blue)] px-4 py-2 rounded shadow font-semibold">Skip to main content</a>
<div id="site-header" data-active="track"></div>

<main id="main-content" class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
  <h1 class="text-2xl font-bold text-slate-800 mb-1">Track Application</h1>
  <p class="text-sm text-slate-500 mb-6">Enter your Application ID to see its live status timeline.</p>

  <form id="trackForm" class="bg-white rounded-xl border border-slate-200 p-4 flex gap-3 mb-8">
    <label for="idInput" class="sr-only">Application ID</label>
    <input id="idInput" placeholder="e.g. APP-88231" class="focus-ring flex-1 border border-slate-300 rounded-lg px-3 py-2.5 text-sm"/>
    <button type="submit" class="focus-ring bg-[var(--gov-blue)] hover:bg-blue-800 text-white text-sm font-semibold rounded-lg px-5 py-2.5">Track</button>
  </form>

  <div id="result" hidden class="bg-white rounded-xl border border-slate-200 p-6">
    <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
      <h2 id="resService" class="font-bold text-slate-800 text-lg"></h2>
      <span id="resStatus" class="status-pill"></span>
    </div>
    <p id="resMeta" class="text-xs text-slate-400 mb-6"></p>

    <ol id="timeline" class="space-y-0"></ol>

    <div class="mt-6 flex flex-wrap gap-3">
      <button id="downloadBtn" class="focus-ring border border-slate-300 rounded-lg px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50">⬇ Download receipt / certificate</button>
      <a href="grievance.html" class="focus-ring border border-slate-300 rounded-lg px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50">Raise a concern about this application</a>
    </div>
  </div>

  <div id="notFound" hidden class="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-400">
    No application found with that ID. Check the ID and try again, or view <a href="dashboard.html" class="text-[var(--gov-blue)] underline">your dashboard</a>.
  </div>

  <div class="mt-8">
    <p class="text-xs font-semibold text-slate-500 mb-2">Your recent applications</p>
    <div id="quickList" class="flex flex-wrap gap-2"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/shared.js"></script>
<script>
  const statusClass = { Pending: 'status-pending', 'Under Review': 'status-review', Approved: 'status-approved', Rejected: 'status-rejected', Draft: 'status-draft' };

  function renderQuickList() {
    const apps = GOV.getApplications();
    document.getElementById('quickList').innerHTML = apps.map(a =>
      `<button data-id="${a.id}" class="focus-ring text-xs border border-slate-300 rounded-full px-3 py-1.5 hover:bg-slate-50">${a.id} · ${a.service}</button>`
    ).join('');
    document.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => lookup(b.dataset.id)));
  }
  renderQuickList();

  function lookup(id) {
    const app = GOV.getApplications().find(a => a.id.toLowerCase() === id.trim().toLowerCase());
    document.getElementById('result').hidden = !app;
    document.getElementById('notFound').hidden = !!app || !id.trim();
    if (!app) return;
    document.getElementById('resService').textContent = app.service;
    document.getElementById('resMeta').textContent = `${app.id} · ${app.dept} · Submitted ${app.date}`;
    const pill = document.getElementById('resStatus');
    pill.className = 'status-pill ' + (statusClass[app.status] || 'status-draft');
    pill.textContent = app.status;

    document.getElementById('timeline').innerHTML = (app.timeline || []).map((t, i, arr) => `
      <li class="relative pl-8 pb-6 ${i === arr.length - 1 ? '' : 'border-l-2 border-slate-200 ml-3'}">
        <span class="absolute -left-[7px] top-0 w-3.5 h-3.5 rounded-full ${i === arr.length - 1 ? 'bg-[var(--gov-blue)]' : 'bg-emerald-500'} ring-4 ring-white"></span>
        <p class="text-sm font-medium text-slate-800">${t.label}</p>
        <p class="text-xs text-slate-400">${t.date} · ${t.by}</p>
      </li>
    `).join('');
  }

  document.getElementById('trackForm').addEventListener('submit', e => { e.preventDefault(); lookup(document.getElementById('idInput').value); });
  document.getElementById('downloadBtn').addEventListener('click', () => GOV.toast('Receipt download started (simulated PDF).', 'success'));

  const pre = new URLSearchParams(location.search).get('id');
  if (pre) { document.getElementById('idInput').value = pre; lookup(pre); }
</script>
</body>
</html>
