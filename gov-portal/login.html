<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Citizen Services Portal (Demo)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/shared.css">
</head>
<body class="bg-[var(--gov-bg)] text-slate-800">

<a href="#main-content" class="skip-link focus-ring bg-white text-[var(--gov-blue)] px-4 py-2 rounded shadow font-semibold">Skip to main content</a>
<div id="site-header" data-active="login"></div>

<main id="main-content" class="max-w-md mx-auto px-4 py-12">
  <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 sm:p-8">
    <h1 class="text-xl font-bold text-slate-800 text-center">Sign in to your account</h1>
    <p class="text-sm text-slate-500 text-center mt-1">Single Sign-On with multi-factor verification (demo — no real OTP is sent).</p>

    <!-- progress -->
    <div class="flex items-center justify-center gap-2 mt-6 mb-6" aria-hidden="true">
      <span id="dot1" class="wizard-step-dot active">1</span><span class="w-8 h-0.5 bg-slate-200"></span>
      <span id="dot2" class="wizard-step-dot">2</span><span class="w-8 h-0.5 bg-slate-200"></span>
      <span id="dot3" class="wizard-step-dot">3</span>
    </div>

    <!-- STEP 1: choose method -->
    <section id="step1">
      <p class="text-xs font-semibold text-slate-500 mb-2">Choose a sign-in method</p>
      <div class="space-y-2">
        <button data-method="aadhaar" class="method-btn focus-ring w-full flex items-center gap-3 border border-slate-300 rounded-lg px-4 py-3 hover:border-[var(--gov-blue)] hover:bg-blue-50 text-left">
          <svg class="w-5 h-5 text-[var(--gov-blue)]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M5 17c1-2 2.5-3 4-3s3 1 4 3M14 9h5M14 13h5"/></svg>
          <span><span class="block text-sm font-semibold">Aadhaar-based OTP</span><span class="block text-xs text-slate-400">e-KYC verification via UIDAI (simulated)</span></span>
        </button>
        <button data-method="mobile" class="method-btn focus-ring w-full flex items-center gap-3 border border-slate-300 rounded-lg px-4 py-3 hover:border-[var(--gov-blue)] hover:bg-blue-50 text-left">
          <svg class="w-5 h-5 text-[var(--gov-blue)]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
          <span><span class="block text-sm font-semibold">Mobile OTP</span><span class="block text-xs text-slate-400">One-time password via SMS</span></span>
        </button>
        <button data-method="biometric" class="method-btn focus-ring w-full flex items-center gap-3 border border-slate-300 rounded-lg px-4 py-3 hover:border-[var(--gov-blue)] hover:bg-blue-50 text-left">
          <svg class="w-5 h-5 text-[var(--gov-blue)]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 11a3 3 0 0 0-3 3c0 3-1 5-2 6M12 11a3 3 0 0 1 3 3c0 1.2-.1 2.2-.3 3M8 21a13 13 0 0 0 1-6c0-1.7.8-3 3-3M17 16.5c.3-1 .5-2 .5-3.5a5.5 5.5 0 0 0-8.7-4.5M6 8a8 8 0 0 1 3-4.5"/></svg>
          <span><span class="block text-sm font-semibold">Biometric verification</span><span class="block text-xs text-slate-400">Fingerprint / iris at an authorised centre</span></span>
        </button>
        <button data-method="password" class="method-btn focus-ring w-full flex items-center gap-3 border border-slate-300 rounded-lg px-4 py-3 hover:border-[var(--gov-blue)] hover:bg-blue-50 text-left">
          <svg class="w-5 h-5 text-[var(--gov-blue)]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span><span class="block text-sm font-semibold">Username &amp; password</span><span class="block text-xs text-slate-400">For registered department officials</span></span>
        </button>
      </div>
    </section>

    <!-- STEP 2: identifier -->
    <section id="step2" hidden>
      <label id="identifierLabel" for="identifier" class="block text-sm font-medium text-slate-700 mb-1">Enter your mobile number</label>
      <input id="identifier" type="text" class="focus-ring w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm" placeholder="e.g. 98XXXXXX10"/>
      <p class="text-xs text-slate-400 mt-1">Demo: any value works — no real message is sent.</p>
      <div class="flex gap-2 mt-5">
        <button data-back="1" class="focus-ring flex-1 border border-slate-300 rounded-lg py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50">Back</button>
        <button id="sendOtpBtn" class="focus-ring flex-1 bg-[var(--gov-blue)] hover:bg-blue-800 text-white rounded-lg py-2.5 text-sm font-semibold">Send OTP</button>
      </div>
    </section>

    <!-- STEP 3: OTP -->
    <section id="step3" hidden>
      <label for="otp" class="block text-sm font-medium text-slate-700 mb-1">Enter the 6-digit OTP</label>
      <input id="otp" inputmode="numeric" maxlength="6" type="text" class="focus-ring w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm tracking-[0.4em] text-center font-semibold" placeholder="••••••"/>
      <p class="text-xs text-slate-400 mt-1">Demo: enter any 6 digits to continue.</p>
      <div class="flex gap-2 mt-5">
        <button data-back="2" class="focus-ring flex-1 border border-slate-300 rounded-lg py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50">Back</button>
        <button id="verifyOtpBtn" class="focus-ring flex-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg py-2.5 text-sm font-semibold">Verify &amp; Sign in</button>
      </div>
    </section>

    <p class="text-xs text-slate-400 text-center mt-6">New to the portal? <a href="#" class="text-[var(--gov-blue)] font-semibold hover:underline">Register as a citizen</a></p>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/shared.js"></script>
<script>
  let method = 'mobile';
  const step1 = document.getElementById('step1'), step2 = document.getElementById('step2'), step3 = document.getElementById('step3');
  const dot1 = document.getElementById('dot1'), dot2 = document.getElementById('dot2'), dot3 = document.getElementById('dot3');

  function showStep(n) {
    step1.hidden = n !== 1; step2.hidden = n !== 2; step3.hidden = n !== 3;
    [[dot1,1],[dot2,2],[dot3,3]].forEach(([el,i]) => {
      el.classList.remove('active','done');
      if (i < n) el.classList.add('done'); else if (i === n) el.classList.add('active');
    });
  }

  document.querySelectorAll('.method-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      method = btn.dataset.method;
      const label = document.getElementById('identifierLabel');
      const map = {
        aadhaar: 'Enter your 12-digit Aadhaar number',
        mobile: 'Enter your mobile number',
        biometric: 'Enter your enrolment ID',
        password: 'Enter your username',
      };
      label.textContent = map[method];
      showStep(2);
    });
  });

  document.querySelectorAll('[data-back]').forEach(btn => btn.addEventListener('click', () => showStep(Number(btn.dataset.back))));

  document.getElementById('sendOtpBtn').addEventListener('click', () => {
    const val = document.getElementById('identifier').value.trim();
    if (!val) { GOV.toast('Please enter a value to continue.', 'warning'); return; }
    if (method === 'password') {
      // skip OTP for password-based officials login
      finishLogin(val);
      return;
    }
    GOV.toast('OTP sent (simulated).', 'success');
    showStep(3);
  });

  document.getElementById('verifyOtpBtn').addEventListener('click', () => {
    const otp = document.getElementById('otp').value.trim();
    if (otp.length !== 6) { GOV.toast('Enter the 6-digit OTP.', 'warning'); return; }
    finishLogin(document.getElementById('identifier').value.trim());
  });

  function finishLogin(identifier) {
    GOV.setUser({ name: 'Demo Citizen', id: 'CIT-' + Math.floor(100000 + Math.random()*899999), identifier, method });
    GOV.toast('Signed in successfully.', 'success');
    setTimeout(() => window.location.href = 'dashboard.html', 500);
  }
</script>
</body>
</html>
